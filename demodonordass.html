<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CureChain · Donor Dashboard</title>

<style>
:root{
  --primary:#8bd7f0;
  --ink:#1f2937;
  --border:#e5e7eb;
  --soft:#f7fcff;
  --radius:14px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui, Segoe UI, Roboto, Inter, Arial, sans-serif;
  color:var(--ink);
  background:#fff;
}

.wrap{
  max-width:980px;
  margin:0 auto;
  padding:16px;
}

/* HEADER SAME NGO */
.banner{
  background:var(--primary);
  color:#064255;
  padding:10px 14px;
  border-radius:12px;
}
.banner h1{
  margin:0;
  font-size:20px;
}

/* STRIP SAME NGO */
.strip{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:12px 0;
}

.box{
  background:var(--soft);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 12px;
}

.box .t{
  font-size:12px;
  opacity:.8;
}

.box .v{
  font-weight:700;
  font-size:18px;
  margin-top:4px;
}

/* TABS SAME NGO */
.tabs{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:8px 0 12px;
}

.tab{
  border:1px solid var(--border);
  background:#fff;
  border-radius:999px;
  padding:7px 12px;
  font-size:14px;
  cursor:pointer;
}

.tab.active{
  background:var(--primary);
  border-color:var(--primary);
}

/* CARD SAME NGO */
.card{
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:12px;
  margin-bottom:8px;
  background:#fff;
}

/* INPUT */
.input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid var(--border);
  font-size:14px;
}

/* BUTTON SAME NGO */
.btn{
  margin:4px;
  border:1px solid var(--primary);
  background:#fff;
  color:#05516a;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
}
.btn.primary{
  background:var(--primary);
  color:#064255;
}

@media (max-width:720px){
  .strip{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<div class="wrap">

  <!-- HEADER -->
  <div class="banner" style="background-color: #e5e7eb;">
    <h1><span style="color: #00BFFF; font-weight: 600;">CureChain </span> · Donor Dashboard</h1>
    <p>Medicine Donation & Request Portal</p>
  </div>

  <!-- STRIP -->
  <div class="strip">
    <div class="box"><div class="t">Total Donations</div><div class="v">0</div></div>
    <div class="box"><div class="t">Pending</div><div class="v">0</div></div>
    <div class="box"><div class="t">Approved</div><div class="v">0</div></div>
    <div class="box"><div class="t">Completed</div><div class="v">0</div></div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="showTab('donate', this)">Donate</button>
    <button class="tab" onclick="showTab('mydonations', this)">My Donations</button>
    <button class="tab" onclick="showTab('requested', this)">Requested Medicines</button>
    <button class="tab" onclick="showTab('profile', this)">Profile</button>
  </div>

  <!-- DONATE -->
  <div id="donate" class="card">
    <h3>Donate Medicine</h3>

    <form action="/donate" method="POST">
      <input class="input" name="med" placeholder="Medicine Name" required>
      <input class="input" name="qty" type="number" placeholder="Quantity" required>
      <input class="input" name="exp" type="date" required>

      <button class="btn primary">Submit Donation</button>
    </form>
  </div>

  <!-- MY DONATIONS -->
  <div id="mydonations" class="card" style="display:none;">
    <h3>My Donations</h3>
    <p>Backend se data yaha aayega</p>
  </div>

  <!-- REQUESTED -->
  <div id="requested" class="card" style="display:none;">
    <h3>Requested Medicines</h3>
    <p>NGO requests yaha show honge</p>
  </div>

  <!-- PROFILE -->
  <div id="profile" class="card" style="display:none;">
    <h3>Profile</h3>
    <p>Name: ---</p>
    <p>Email: ---</p>
    <p>Phone: ---</p>
  </div>

</div>

<script>
function showTab(tabId, btn){
  document.querySelectorAll('.card').forEach(sec=>{
    sec.style.display = "none";
  });

  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.remove('active');
  });

  document.getElementById(tabId).style.display = "block";
  btn.classList.add('active');
}
</script>

</body>
</html>
